name: Keep Streamlit app awake

# Streamlit Community Cloud sleeps an app after a period without traffic, and
# its sleep page still answers 200 - so an HTTP check stays green while the app
# is down. This drives a real browser instead, which both sees the true state
# and opens the websocket session that actually counts as activity.
on:
  schedule:
    - cron: "0 */4 * * *"   # 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake and check the app
        run: python wake.py

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-screenshot
          path: "*.png"
          if-no-files-found: ignore
