name: Keep Streamlit app awake

# Streamlit Community Cloud puts an app to sleep after a period with no
# traffic. This workflow sends a request every 6 hours so the demo is
# always live for anyone opening the link.
on:
  schedule:
    - cron: "0 */6 * * *"   # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Request the app
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 \
            https://banking-support-agent.streamlit.app)
          echo "HTTP $code"
          # Streamlit returns 200 once the container is serving.
          # Any 2xx/3xx counts as awake; anything else fails the run so
          # a genuinely broken deploy shows up in the Actions tab.
          case "$code" in
            2*|3*) echo "App is awake." ;;
            *) echo "Unexpected status: $code"; exit 1 ;;
          esac
